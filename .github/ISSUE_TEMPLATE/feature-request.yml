name: "\U0001F4A1 Feature Request"
description: "Suggest a feature or improvement for any app"
labels: ["feature-request"]
body:
  - type: dropdown
    id: app
    attributes:
      label: Which app?
      options:
        - JSON Hub (Windows)
        - XML Hub (Windows)
        - CSV Hub (Windows)
        - JSON Tools (macOS / iPadOS)
        - XML Tools (macOS / iPadOS)
        - YAML Tools (macOS / iPadOS)
        - All apps (cross-app suggestion)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What would you like to see?
      description: Describe the feature and the problem it solves.
      placeholder: "e.g. It would be great if I could..."
    validations:
      required: true
