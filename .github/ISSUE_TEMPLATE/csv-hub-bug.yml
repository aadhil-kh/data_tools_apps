name: "\U0001F41B [CSV Hub] Bug Report"
description: "Report a bug in CSV Hub (Windows)"
labels: ["bug", "app: csv-hub"]
body:
  - type: input
    id: version
    attributes:
      label: App version & Windows version
      description: "Find app version in Settings → About"
      placeholder: "e.g. CSV Hub 1.0.0 / Windows 11 24H2"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the issue. What did you expect to happen?
      placeholder: "e.g. CSV import loses special characters."
    validations:
      required: true
